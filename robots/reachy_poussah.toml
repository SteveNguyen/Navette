# Reachy Mini on the Poussah self-balancing base.
# Lengths in m, times in s, speeds in m/s and rad/s. Every key is required (navette/config.py).

[robot]
name = "reachy_poussah"
adapter = "navette.robots.reachy_poussah"

[footprint]
radius = 0.13   # Mini (17 cm cylinder) on the ~25 cm wide base
margin = 0.05

[safety]
# Stopping distance planned at speed v: v * (perception.stale_s + base_lag_s) + v^2 / (2 decel).
# Measured with the Mini on the base, stop commands at 0.184 / 0.209 / 0.342 m/s -> 0.143 / 0.165 / 0.307 m
# travelled; least squares: lag 0.63 s (the base rolls on while the balance controller leans back), decel
# 0.64 m/s^2, residuals 1 mm. (The base alone gave 0.13 s / 0.16 m/s^2, which under-predicts with the Mini on.)
# Planned stop with stale_s = 0.9: 0.25 m at 0.15 m/s, 0.34 m at 0.2, 0.53 m at 0.3.
# Why the lag: the balancer pulls the base toward a position goal advancing at the commanded speed; a stop
# freezes the goal and the base catches up the lag it had (firmware), ~v x 0.63 s at steady speed. Right after a
# start the base is slower to follow and the lag can be larger (8 cm after a 0.75 s burst at 0.1 m/s, measured),
# which the margin and the spare in stale_s (outputs are ~0.4 s old typically, 0.9 s allowed) absorb at these
# speeds; to re-check if v_max goes up.
v_max = 0.4
decel = 0.64
base_lag_s = 0.63
unseen_m = 0.35
reverse_max = 0.0
step = 0.02
n_speeds = 20

[perception]
# Age of a navigator output = capture-to-output latency + up to one step period. Measured on the CM4, explore
# behaviour on the base: 391 / 537 / 852 ms (p50 / p95 / max). 0.3 s can never hold at this frame rate, and
# 0.6 s halted every few tens of seconds; 0.9 s held a 224 s exploration.
stale_s = 0.9
imu_max_age_s = 0.1
up_g_s = 1.0

[camera]
# Height of the Mini's body frame above the floor when on the base. NOT MEASURED: 0.325 puts the camera at
# ~0.35 m. (Mini standing on the floor: 0.215.)
body_z = 0.325
# Radius around the robot the camera cannot see at its navigation pose (the closest visible floor is at
# ~0.47 m): the planner's blind disk.
blind_m = 0.5

[explore]
# Candidate speeds of the arc controller. The collision monitor allows up to safety.v_max, and controller.v_max
# (0.15) then scales the command down, keeping its curvature: with these values the controller prefers its
# fastest admissible arc and the robot drives it at the cap (0.2 and 0.3 are both sent as 0.15). To make it
# choose among speeds the robot really drives, list speeds under controller.v_max.
v_set = [0.1, 0.2, 0.3]
# The behaviour's switches below default to off in the core (the prototype's behaviour); this robot turns them on.
# Why: in a 4-minute exploration the robot turned in place 54% of the time and reversed its turn ~16 times. 14 of
# its 15 blocks came from the current scan's near sectors (obstacles touching the image bottom: walls at an angle
# in a corridor, bottles, shoes), which the arc controller always put at the clearance radius, while the collision
# monitor exempts those the map explains: on 512 of the 1405 steps without an admissible arc, the monitor's rule
# allowed some. near_known = true: the arcs use the monitor's rule (the monitor itself is unchanged).
near_known = true
# Latched turns in place. The turn direction was sign(goal - heading) at every step, so a goal near 180 deg off or
# a replan reversed a turn half-way. Now a turn keeps its direction unless the goal moved more than spin_flip_deg
# (or the robot overshot). Its end is tested on the heading spin_lead_s ahead (heading + measured yaw rate x
# spin_lead_s): the command takes effect ~0.4-0.9 s after the frame (outputs ~0.4 s old typically, see
# [perception]), turning at ~0.43 rad/s. spin_accel / spin_w_min: slow down before the end, |w| =
# min(w_spin, max(spin_w_min, sqrt(2 spin_accel angle))).
spin_flip_deg = 45.0
spin_lead_s = 0.5
spin_accel = 0.5
spin_w_min = 0.3
# Blocked (-> recovery turn) only after blocked_s without progress: moved progress_m or turned progress_deg (~0.3
# rad) since the last progress, a rotation counting (Nav2's pose progress checker). The core default is 1 s without
# an admissible arc or below 0.05 m/s: on this robot every short hesitation of the arcs started a recovery turn
# away from the path (15 in 4 minutes), each followed by a turn back.
blocked_s = 3.0
blocked_progress = true
progress_m = 0.05
progress_deg = 17.0

[behaviour]
default = "explore"
forward_v = 0.15
# Restart hysteresis (the core's defaults are 2 and 0.0: no hysteresis). After any stop this balancing base
# still travels the lag it built (5-9 cm at 0.1 m/s, more right after a start), so short start-stop bursts
# overshoot most. Stopping and restarting at the edge of a blocked zone produces exactly such bursts: after a
# stop, the robot moves again only once the request fits with 0.10 m more clearance, resume_n frames in a row
# (4: about 0.5 s at the ~8 Hz loop). Stops are unchanged.
resume_n = 4
resume_margin = 0.10

[controller]
v_max = 0.15           # cap after the collision monitor
w_max = 0.5
cmd_hz = 20.0          # the base's dead-man is 0.5 s
start_timeout_s = 10.0 # stand-up: measured 0.25 s

[page]
port = 8090
# The phone's STOP goes over the robot's WiFi, which once dropped completely while the robot kept exploring
# over Bluetooth. The page polls every 0.5 s (or timeout_s / 4 if shorter); a run halts when the polls stop for
# this long. 0 = off.
timeout_s = 2.0
# The CM4's WiFi and Bluetooth share one radio: a preview every 0.5 s coincided with a 0.9 s stall of the
# base's telemetry.
preview_s = 2.0

[glance]
n_frames = 2
settle_s = 0.3
cooldown_s = 5.0
moved_m = 0.1
turned_deg = 20.0
retries = 2

[adapter]
# Files the robot needs, relative to this file (not in the repository):
#   model       floor segmentation model (.onnx, input "input" 1x3x192x320, 2 or 3 output channels)
#   calib       camera intrinsics: {"image_resolution": [W, H], "K": 3x3, "D": OpenCV distortion}
#   r_cam_imu   {"R_cam_imu": 3x3}, IMU axes -> camera axes
#   handeye     {"T_head_cam_fitted": 4x4}, camera pose in the head frame
paths = ["model", "calib", "r_cam_imu", "handeye"]
model = "models/floor.onnx"
calib = "calib/calib.json"
r_cam_imu = "calib/R_cam_imu.json"
handeye = "calib/handeye_X.json"
floor_thr = 0.7          # floor probability cutoff
under_thr = 0.5          # 'under' cutoff (3-channel model): floor with something low above it is not drivable
model_threads = 2        # CM4: 1 -> 86 ms, 2 -> 60, 3 -> 56, 4 -> 62; 2 leaves cores to the rest
camera_latency_s = 0.038 # the frames lag the IMU by this much
nav_pitch_deg = 15.0     # head pitch (down) while navigating
# Head pitch of a glance at the ground just ahead; 0 = no glance. Keep 0: a 35 deg head move shifted the
# centre of mass of the balancing base and its firmware cut the motors (runaway: both wheels past 16 rad/s).
glance_pitch_deg = 0.0
daemon_python = "/venvs/mini_daemon/bin/python"  # runs the 400 Hz IMU reader (needs smbus3)
base_link = "ble"        # "ble" or "usb"
ble_name = "rmini_wheels"
usb_port = "/dev/ttyACM0"
nav_rate_hz = 50         # the base's telemetry rate
# Base settings sent before each stand-up, while it sits (RAM only: lost at reboot). Empty: since firmware
# 8c704f1 the base loads its Mini-on profile itself from its seat switch ([diag] mini=1 ofs=2.4), and a copy here
# would silently override later retuning of that profile. Older firmware boots with a wheel speed loop that is
# wrong for the Mini and O0 (11-15 cm settle roll after S0); for it, send the floor tool's Mini line:
#   ["A40", "B-5", "C1.65", "D1", "O2.4", "M0", "UF0.1", "pv2.5", "pmVP0.5", "pmVF0.0015", "pmVI30", "pf0"]
stand_settings = []
